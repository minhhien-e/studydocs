asyncapi: "2.6.0"
info:
  title: Notification Service
  version: "1.0.0"
  description: >
    AsyncAPI spec for RabbitMQ notification service.
    Defines exchange, queues, routing keys, and message formats
    for email notifications and push document upload events.

servers:
  rabbitmq:
    url: localhost:5672
    protocol: amqp
    description: Local RabbitMQ broker
    variables:
      vhost:
        default: "/"

defaultContentType: application/json

channels:
  # Email notification channel
  notification.email.send:
    description: Channel for sending email notifications.
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: exchange.notification
          type: topic
          durable: true
          autoDelete: false
        queue:
          name: queue.notification.email
          durable: true
          exclusive: false
          autoDelete: false
        bindingVersion: "0.2.0"

    subscribe:
      summary: Consumer subscribes to email queue
      operationId: SendMailEvent
      message:
        $ref: '#/components/messages/SendMailEvent'

  # Push notification channel (document upload)
  notification.push.upload.document:
    description: Channel for push notifications when a document is uploaded.
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: exchange.notification
          type: topic
          durable: true
          autoDelete: false
        queue:
          name: queue.notification.push.document.upload
          durable: true
          exclusive: false
          autoDelete: false
        bindingVersion: "0.2.0"
    subscribe:
      summary: Consumer subscribes to document upload queue
      operationId: UploadDocumentEvent
      message:
        $ref: '#/components/messages/UploadDocumentEvent'

components:
  messages:
    SendMailEvent:
      name: SendMailEvent
      title: Send Mail Event
      summary: Trigger sending an email to a user
      payload:
        $ref: '#/components/schemas/SendMailEvent'
      bindings:
        amqp:
          messageType: 'notification.email.send'

    UploadDocumentEvent:
      name: UploadDocumentEvent
      title: Upload Document Event
      summary: Trigger push notification for document upload
      payload:
        $ref: '#/components/schemas/UploadDocumentEvent'
      bindings:
        amqp:
          messageType: 'notification.push.upload.document'

  schemas:
    SendMailEvent:
      type: object
      required: [ userId, email, templateName ]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
          format: email
        templateName:
          type: string
        templateData:
          type: object
          additionalProperties: true

    UploadDocumentEvent:
      type: object
      required: [ userId, documentId, documentName, uploadedAt ]
      properties:
        userId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        documentName:
          type: string
        uploadedAt:
          type: string
          format: date-time
