plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'studydocs.user-service'
version = '1.0.0'
sourceCompatibility = '17'

repositories {
	mavenCentral()
	maven { url 'https://jitpack.io' }

}

dependencies {
	// Spring Boot core
	implementation 'org.springframework.boot:spring-boot-starter-web'
	//	Mongo DB
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	// Spring Security (nếu có xác thực)
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
// env
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'
	// Spring Boot Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

//	// Spring Cloud (Eureka client)
//	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'
//	rabbit mq
//	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
//Fallback
	implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
//	Thư viện minh hiển
//	implementation 'com.github.minhhien-e:studydocs:1.0.0'
	// Test
	testImplementation platform('org.junit:junit-bom:5.10.0')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
	useJUnitPlatform()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:2023.0.1" // hoặc phiên bản tương thích
	}
}
