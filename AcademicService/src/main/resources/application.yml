spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:academic_management}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_MYSQL_USERNAME:root}
    password: ${DB_MYSQL_PASSWORD:01252331055}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:8080
      client:
        registration:
          google:
            client-id: your-google-client-id
            client-secret: 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
            scope: openid,profile,email

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
    org.flywaydb.core: TRACE
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
