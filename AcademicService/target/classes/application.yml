server:
  port: ${SERVER_PORT:8083}
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:academic_management}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_MYSQL_USERNAME:root}
    password: ${DB_MYSQL_PASSWORD:01252331055}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect

  security:
    oauth2:
      resourceserver:
        jwt:
          # JWKS endpoint từ demo-auth service
          jwk-set-uri: ${AUTH_SERVICE_JWKS_URL:http://localhost:8080/.well-known/jwks.json}
          # Issuer từ demo-auth
          issuer-uri: ${AUTH_SERVICE_ISSUER:http://localhost:8080}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.flywaydb: DEBUG
    org.flywaydb.core: TRACE
    com.zaxxer.hikari: DEBUG
    org.springframework.jdbc: DEBUG
