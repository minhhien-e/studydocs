<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác nhận quyền truy cập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .consent-container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .scope-item {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            background-color: #f8f9fa;
        }
        .scope-description {
            color: #6c757d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="consent-container">
            <h2 class="mb-4">Yêu cầu cấp quyền</h2>
            
            <div class="alert alert-info">
                <strong th:text="${clientId}"></strong> muốn truy cập vào tài khoản của bạn
            </div>

            <form th:action="@{/oauth2/authorize}" method="post">
                <input type="hidden" name="client_id" th:value="${clientId}">
                <input type="hidden" name="state" th:value="${state}">

                <div class="mb-4">
                    <h5>Ứng dụng sẽ có thể:</h5>
                    <div class="scope-item" th:each="scope : ${scopes}">
                        <div class="form-check">
                            <input class="form-check-input" 
                                   type="checkbox" 
                                   th:name="scope" 
                                   th:value="${scope.scope}"
                                   th:id="${scope.scope}"
                                   checked>
                            <label class="form-check-label" th:for="${scope.scope}">
                                <strong th:text="${scope.description}">Scope Description</strong>
                                <div class="scope-description" th:text="${scope.details}">
                                    Additional details about this permission
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <button type="submit" name="consent_action" value="deny" 
                            class="btn btn-outline-danger">
                        Từ chối
                    </button>
                    <button type="submit" name="consent_action" value="approve" 
                            class="btn btn-primary">
                        Cho phép
                    </button>
                </div>
            </form>

            <div class="mt-4">
                <small class="text-muted">
                    Bằng việc cho phép, bạn đồng ý chia sẻ thông tin với ứng dụng này.
                    Bạn có thể thu hồi quyền truy cập bất kỳ lúc nào trong phần cài đặt tài khoản.
                </small>
            </div>
        </div>
    </div>
</body>
</html>
