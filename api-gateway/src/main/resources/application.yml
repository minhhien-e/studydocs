server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ${APP_NAME:api-gateway}

  cloud:
    gateway:
      httpclient:
        connect-timeout: ${CONNECT_TIMEOUT:60000}     # 60s – thời gian kết nối
        response-timeout: ${RESPONE_TIMEOUT:120s}
      routes:
        # =========================
        # USER SERVICE
        # =========================
        - id: user-service
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=${USER_SERVICE_PATH:/api/v1/users/**}
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: ${USER_RATE_REPLENISH:5}
                redis-rate-limiter.burstCapacity: ${USER_RATE_BURST:10}
            - name: CircuitBreaker
              args:
                name: ${USER_CIRCUIT_NAME:userCircuitBreaker}
                fallbackUri: ${USER_FALLBACK_URI:forward:/fallback/users}
        - id: user-service-internal
          uri: ${USER_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=${USER_SERVICE_INTERNAL_PATH}
          filters:
            - name: CircuitBreaker

        # =========================
        # AUTHENTICATION SERVICE
        # =========================
        - id: authentication-service
          uri: ${AUTHENTICATION_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=${AUTHENTICATION_SERVICE_PATH:/api/v1/auth/**}
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: ${AUTHENTICATION_RATE_REPLENISH:10}
                redis-rate-limiter.burstCapacity: ${AUTHENTICATION_RATE_BURST:20}
            - name: CircuitBreaker
              args:
                name: ${AUTHENTICATION_CIRCUIT_NAME:authenticationCircuitBreaker}
                fallbackUri: ${AUTHENTICATION_FALLBACK_URI:forward:/fallback/authentication}

        # =========================
        # NOTIFICATION SERVICE
        # =========================
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:http://notification-service:8087}
          predicates:
            - Path=${NOTIFICATION_SERVICE_PATH:/api/v1/notifications/**}
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}"
                redis-rate-limiter.replenishRate: ${NOTIFY_RATE_REPLENISH:5}
                redis-rate-limiter.burstCapacity: ${NOTIFY_RATE_BURST:10}
            - name: CircuitBreaker
              args:
                name: ${NOTIFY_CIRCUIT_NAME:notificationCircuitBreaker}
                fallbackUri: ${NOTIFY_FALLBACK_URI:forward:/fallback/notifications}

        # =========================
        # REVIEW SERVICE
        # =========================
        - id: review-service
          uri: ${REVIEW_SERVICE_URI:http://review-service:8086}
          predicates:
            - Path=${REVIEW_SERVICE_PATH:/api/v1/review/**}
          filters:
            - name: CircuitBreaker
              args:
                name: ${REVIEW_CIRCUIT_NAME:reviewCircuitBreaker}
                fallbackUri: ${REVIEW_FALLBACK_URI:forward:/fallback/review}

        # =========================
        # FOLLOW SERVICE
        # =========================
        - id: follow-service
          uri: ${FOLLOW_SERVICE_URI:http://follow-service:8089}
          predicates:
            - Path=${FOLLOW_SERVICE_PATH:/api/v1/follow/**}
          filters:
            - name: CircuitBreaker
              args:
                name: ${FOLLOW_CIRCUIT_NAME:followCircuitBreaker}
                fallbackUri: ${FOLLOW_FALLBACK_URI:forward:/fallback/follow}

        # =========================
        # ACADEMIC SERVICE
        # =========================
        - id: academic-service
          uri: ${ACADEMIC_SERVICE_URI:http://academic-service:8083}
          predicates:
            - Path=${ACADEMIC_SERVICE_PATH:/api/v1/academic/**}
          filters:
            - name: CircuitBreaker
              args:
                name: ${ACADEMIC_CIRCUIT_NAME:academicCircuitBreaker}
                fallbackUri: ${ACADEMIC_FALLBACK_URI:forward:/fallback/academic}

        # =========================
        # SEARCH SERVICE
        # =========================
        - id: search-service
          uri: ${SEARCH_SERVICE_URI:http://search-service:8088}
          predicates:
            - Path=${SEARCH_SERVICE_PATH:/api/v1/search/**}
          filters:
            - name: CircuitBreaker
              args:
                name: ${SEARCH_CIRCUIT_NAME:searchCircuitBreaker}
                fallbackUri: ${SEARCH_FALLBACK_URI:forward:/fallback/search}

        # =========================
        # DOCUMENT SERVICE
        # =========================
        - id: document-service
          uri: ${DOCUMENT_SERVICE_URI:http://document-service:8085}
          predicates:
            - Path=${DOCUMENT_SERVICE_PATH:/api/v1/documents/**}
          filters:
            - name: CircuitBreaker
              args:
                name: ${DOCUMENT_CIRCUIT_NAME:documentCircuitBreaker}
                fallbackUri: ${DOCUMENT_FALLBACK_URI:forward:/fallback/document}
        - id: document-service-internal
          uri: ${DOCUMENT_SERVICE_URI:http://document-service:8085}
          predicates:
            - Path=${DOCUMENT_SERVICE_INTERNAL_PATH}
          filters:
            - name: CircuitBreaker
        # =========================
        # MEDIA SERVICE
        # =========================
        - id: media-service
          uri: ${MEDIA_SERVICE_URI:http://media-service:8084}
          predicates:
            - Path=${MEDIA_SERVICE_PATH:/api/v1/assets/**}
          filters:
            - name: CircuitBreaker
              args:
                name: ${MEDIA_CIRCUIT_NAME:mediaCircuitBreaker}
                fallbackUri: ${MEDIA_FALLBACK_URI:forward:/fallback/media}
        - id: media-service-internal
          uri: ${MEDIA_SERVICE_URI:http://media-service:8084}
          predicates:
            - Path=${MEDIA_SERVICE_INTERNAL_PATH}
          filters:
            - name: CircuitBreaker
  # =========================
  # REDIS (Rate Limiter)
  # =========================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # =========================
  # SECURITY (JWT Validation)
  # =========================
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_JWKS_URL:http://localhost:8081/api/v1/auth/.well-known/jwks.json}
          issuer-uri: ${AUTH_SERVICE_ISSUER:http://localhost:8081/api/v1/auth}
gateway:
  security:
    public-paths: ${GATEWAY_PUBLIC_PATHS}

# =========================
# LOGGING
# =========================
logging:
  level:
    org.springframework.cloud.gateway: ${LOG_GATEWAY:DEBUG}
    reactor.netty.http.server: ${LOG_NETTY:DEBUG}
