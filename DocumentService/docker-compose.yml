version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: document-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: document
      MYSQL_USER: studydocs
      MYSQL_PASSWORD: 123456
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  document-service:
    build: .
    container_name: document-service
    restart: unless-stopped
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      SERVER_PORT: ${SERVER_PORT}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/document?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useLegacyDatetimeCode=false
      SPRING_DATASOURCE_USERNAME: studydocs
      SPRING_DATASOURCE_PASSWORD: 123456
      UPLOAD_SERVICE_URL: ${UPLOAD_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      SECURITY_OAUTH2_JWT_ISSUER_URI: http://host.docker.internal:8081
      AUTH_SERVICE_JWKS_URL: http://host.docker.internal:8081/.well-known/jwks.json
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-data:
