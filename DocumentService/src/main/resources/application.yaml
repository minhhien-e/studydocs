server:
  port: ${SERVER_PORT:9050}

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/document?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useLegacyDatetimeCode=false
    username: studydocs
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

#  rabbitmq:
#    host: ${RABBIT_HOST:localhost}
#    port: ${RABBIT_PORT:5672}
#    username: ${RABBIT_USER:guest}
#    password: ${RABBIT_PASS:guest}

upload:
  service:
    url: ${UPLOAD_URL:http://10.0.0.170:8084/api/v1/files}

notification:
  service:
    url: ${NOTIFICATION_URL:http://10.0.0.170:8087/api/v1/notifications}

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${SECURITY_OAUTH2_JWT_ISSUER_URI}
        jwk-set-uri: ${AUTH_SERVICE_JWKS_URL}
