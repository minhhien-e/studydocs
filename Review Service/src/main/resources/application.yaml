server:
  port: ${SERVER_PORT:8086}

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/reviews}
      uuid-representation: standard

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SECURITY_OAUTH2_JWT_ISSUER_URI:http://10.10.3.165:8080/api/v1/auth/}
          jwk-set-uri: ${AUTH_SERVICE_JWKS_URL:http://10.10.3.165:8080/api/v1/auth/.well-known/jwks.json}


document:
  service:
    url: ${DOCUMENT_SERVICE_URL:http://10.10.3.165:8080/api/v1}

notification:
  service:
    url: ${NOTIFICATION_SERVICE_URL:http://10.0.0.170:8087/api/v1/notifications}

logging:
  level:
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
    org.springframework.security: TRACE
    org.springframework.security.oauth2: TRACE
    org.springframework.data.mongodb: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_MONGODB:INFO}


