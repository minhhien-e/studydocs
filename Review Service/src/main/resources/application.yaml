server:
  port: ${SERVER_PORT:9051}

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/reviews}
      uuid-representation: standard

document:
  service:
    url: ${DOCUMENT_SERVICE_URL:http://localhost:9050/documents}

logging:
  level:
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK:INFO}
    org.springframework.data.mongodb: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_MONGODB:INFO}

security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${SECURITY_OAUTH2_JWT_ISSUER_URI}
        jwk-set-uri: ${AUTH_SERVICE_JWKS_URL}
