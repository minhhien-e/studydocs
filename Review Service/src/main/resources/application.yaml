server:
  port: ${SERVER_PORT}

spring:
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      uuid-representation: standard

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SECURITY_OAUTH2_JWT_ISSUER_URI}
          jwk-set-uri: ${AUTH_SERVICE_JWKS_URL}


document:
  service:
    url: ${DOCUMENT_SERVICE_URL}

logging:
  level:
    org.springframework: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK}
    org.springframework.security: TRACE
    org.springframework.security.oauth2: TRACE
    org.springframework.data.mongodb: ${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_DATA_MONGODB}


