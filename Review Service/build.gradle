plugins {
    id 'java'
    id 'org.springframework.boot' version '3.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'studydocs'
version = '0.0.1-SNAPSHOT'
description = 'Review Service for Document Management'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Spring Boot Web (REST Controller, JSON)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Data MongoDB (thay vì JPA)
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // Validation (Jakarta Validation API)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Security OAuth2 Resource Server for JWT
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    //hiển
    implementation 'com.github.minhhien-e:studydocs:1.0.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Lombok (nếu dùng, thêm annotation processor)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}