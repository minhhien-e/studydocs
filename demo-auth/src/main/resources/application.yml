server:
  port: ${SERVER_PORT:8081}
spring:
  # Application name
  application:
    name: auth-service

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
  # Database configuration
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_MYSQL_USERNAME}
    password: ${DB_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Flyway migration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  # JPA/Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: none  # Flyway handles schema
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # Redis configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # ssl:
        # enabled: false

# JWT nội bộ (phát access/refresh token)
jwt:
  # Ưu tiên dùng keystore RSA (dev đang để sẵn classpath:jwt-keystore.jks)
  keystore-location: ${JWT_KEYSTORE_LOCATION:classpath:jwt-keystore.jks}
  keystore-password: ${JWT_KEYSTORE_PASSWORD:changeit}
  key-alias: ${JWT_KEY_ALIAS:jwt-key}
  key-password: ${JWT_KEY_PASSWORD:changeit}
  issuer: ${JWT_ISSUER:http://localhost:8080}
  access-token-ttl-seconds: 900
  refresh-token-ttl-seconds: 1209600

app:
  remote:
    user-url: ${USER_URL}
