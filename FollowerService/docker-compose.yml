version: '3.9'
services:
  db:
    image: mysql:8.0
    container_name: follower_db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 01252331055
      MYSQL_DATABASE: follower_service_db
      MYSQL_USER: root
      MYSQL_PASSWORD: 01252331055
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  follower-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: soha18/studydocs:follow-2026-01-18
    container_name: follower_service
    ports:
      - "8089:8089"
    environment:
      GOOGLE_CLIENT_ID: "your-google-client-id"
      GOOGLE_CLIENT_SECRET: ""
      WEB_CLIENT_SECRET: "my-web-client-secret"
      MOBILE_CLIENT_SECRET: "my-mobile-secret"
      DB_MYSQL_USERNAME: "root"
      DB_MYSQL_PASSWORD: "01252331055"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_NAME: "follower_service_db"
      JWT_SECRET: "dev-jwt-secret-key-for-testing"
      JWT_EXPIRATION: "86400000"
      SPRING_PROFILES_ACTIVE: "dev"
      SERVER_PORT: "8089"
      AUTH_SERVICE_JWKS_URL: "http://localhost:8081/auth/v1/.well-known/jwks.json"
      AUTH_SERVICE_ISSUER: "http://localhost:8081"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
